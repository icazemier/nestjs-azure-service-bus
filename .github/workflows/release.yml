name: Release

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Loads the built artifacts the way consumers do; the unit tests import
      # TypeScript sources and cannot catch a wrong module format.
      - name: Smoke test built package
        run: npm run smoke

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Versioning happens in place rather than through a release PR, so merging
      # into a release branch publishes directly. Consumes any pending changesets
      # into the version, changelog and lockfile.
      - name: Apply pending changesets
        run: npm run release:version

      - name: Commit the version bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || git commit -m 'chore: version packages'
          git push origin HEAD:"$GITHUB_REF_NAME"

      # Trusted publishing needs npm 11.5.1 or newer. The version is pinned
      # rather than floating because this step installs code that then runs
      # while the OIDC token is available.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@12.0.2

      # Publishes whatever is now unpublished and creates the git tag and GitHub
      # release. Publishing goes through the runner's own npm, so it uses OIDC
      # trusted publishing and needs no long-lived token; provenance comes from
      # publishConfig.
      - name: Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release

  verify:
    name: Verify the registry serves this version
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The release job commits the version bump during this run, so the
      # triggering commit still carries the previous version. Check out the
      # branch tip instead, or the wrong version is asserted.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      # `npm publish` exits 0 when it skips a version the registry already has,
      # so a green publish step never proved anything shipped. The registry is
      # asserted to actually serve this version before the run is called a
      # success. No dependencies are needed: the script only uses node builtins.
      - name: Verify npm serves this version
        run: npm run verify:published
